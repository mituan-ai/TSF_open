[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tsf-open"
version = "0.2.0"
description = "LLM-guided task-semantic field factorization for industrial process forecasting"
requires-python = ">=3.14"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "matplotlib",
]
llm = [
  "openai",
]
train = [
  "kernels",
  "scikit-learn",
  "torch",
  "transformers",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "live: tests that perform real external LLM or embedding calls",
]
