dataset:
  name: ladle_preheating
  path: resources/datasets/ladle_preheating
  data_name: windows.npz
  split:
    validation_column: process_name
    validation_groups: ["process_02", "process_06", "process_11", "process_26", "process_29"]
    train_column: split
    train_value: train
    test_group_column: process_name
    test_groups: ["process_13", "process_23", "process_33"]
    scenario_column: process_name

model:
  output_dim: 5
  backbone:
    type: gru
    hidden_size: 96
    num_layers: 2
    dropout: 0.2

method:
  name: baseline

training:
  seed: 42
  device: cuda
  max_epochs: 100
  batch_size: 128
  num_workers: 0
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: MSELoss
  gradient_clip_norm: 1.0
  early_stopping_patience: 40
  early_stopping_min_delta: 0.00001
  scheduler: ReduceLROnPlateau
  scheduler_factor: 0.5
  scheduler_patience: 15
  min_lr: 0.00001

evaluation:
  metrics: ["MAE", "RMSE", "R^2", "Inference Time (ms/step)", "Parameters", "Peak RSS (MB)"]
  groups: ["overall", "process_name"]
  timing_warmup_loops: 2
  timing_repeat_loops: 5

output:
  root: outputs/runs
